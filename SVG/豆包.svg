<svg width="600" height="320" viewBox="0 0 600 320" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .wheel {
        animation: rotate 1s linear infinite;
        transform-origin: center;
      }
      .ride {
        animation: move 8s linear infinite;
      }
      @keyframes rotate {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }
      @keyframes move {
        0% { transform: translateX(-120px); }
        100% { transform: translateX(720px); }
      }
      .beak-bob {
        animation: bob 0.6s ease-in-out infinite alternate;
      }
      @keyframes bob {
        from { transform: translateY(0); }
        to { transform: translateY(-3px); }
      }
    </style>
  </defs>

  <!-- 地面 -->
  <rect x="0" y="260" width="600" height="60" fill="#88c878"/>
  <path d="M0 260 Q150 250, 300 260 Q450 270, 600 260" stroke="#559944" stroke-width="3" fill="none"/>

  <!-- 云朵 -->
  <g opacity="0.7">
    <ellipse cx="100" cy="60" rx="30" ry="18" fill="#fff"/>
    <ellipse cx="125" cy="55" rx="22" ry="14" fill="#fff"/>
    <ellipse cx="420" cy="80" rx="26" ry="15" fill="#fff"/>
    <ellipse cx="442" cy="76" rx="18" ry="11" fill="#fff"/>
  </g>

  <!-- 骑行组（整体平移） -->
  <g class="ride">
    <!-- 自行车 -->
    <g transform="translate(0,0)">
      <!-- 后轮 -->
      <circle class="wheel" cx="100" cy="220" r="32" fill="none" stroke="#333" stroke-width="4"/>
      <circle cx="100" cy="220" r="3" fill="#333"/>
      <!-- 前轮 -->
      <circle class="wheel" cx="210" cy="220" r="32" fill="none" stroke="#333" stroke-width="4"/>
      <circle cx="210" cy="220" r="3" fill="#333"/>
      <!-- 车架 -->
      <path d="M100 220 L145 160 L210 220 M145 160 L175 120 M145 160 L100 190" stroke="#444" stroke-width="4" fill="none"/>
      <!-- 车把手 -->
      <path d="M175 120 L195 108" stroke="#444" stroke-width="4"/>
      <!-- 坐垫 -->
      <path d="M132 166 L148 162" stroke="#222" stroke-width="3"/>
      <!-- 脚踏 -->
      <g>
        <path d="M120 205 L130 212" stroke="#222" stroke-width="3"/>
      </g>
    </g>

    <!-- 鹈鹕 -->
    <g transform="translate(135,130)">
      <!-- 身体 -->
      <ellipse cx="0" cy="25" rx="28" ry="22" fill="#f0f0f0"/>
      <!-- 翅膀 -->
      <path d="M-18 15 Q-30 30, -12 38" fill="#dddddd"/>
      <!-- 脖子 -->
      <path d="M0 5 Q5 -15, 12 -24" stroke="#f0f0f0" stroke-width="12" fill="none"/>
      <!-- 头 -->
      <circle cx="14" cy="-28" r="10" fill="#f0f0f0"/>
      <!-- 眼睛 -->
      <circle cx="18" cy="-30" r="2" fill="#222"/>
      <!-- 大嘴（鹈鹕标志性喉囊，上下晃动） -->
      <g class="beak-bob">
        <path d="M22 -26 L48 -22 Q52 -12, 44 -6 L24 -14 Z" fill="#ffb866"/>
        <path d="M22 -24 L46 -19" stroke="#dd8833" stroke-width="2"/>
      </g>
      <!-- 腿踩脚踏 -->
      <path d="M-8 40 L-14 62" stroke="#eee" stroke-width="6"/>
      <path d="M8 40 L16 60" stroke="#eee" stroke-width="6"/>
    </g>
  </g>

  <!-- 太阳 -->
  <circle cx="520" cy="70" r="28" fill="#ffdd44"/>
</svg>