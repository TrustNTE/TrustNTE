<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>鹈鹕骑自行车 🚴‍♂️🐦</title>
  <style>
    body { margin: 0; display: flex; justify-content: center; align-items: center; min-height: 100vh; background: #e0f7fa; }
    svg { width: 100%; max-width: 800px; border-radius: 12px; box-shadow: 0 10px 30px rgba(0,0,0,.15); }

    /* --- 动画核心 --- */
    .spin     { transform-origin: 0 0; animation: spin 2s linear infinite; }
    .spin-rev { transform-origin: 0 0; animation: spin 2s linear infinite reverse; } /* 抵消父级旋转，踏板永远水平！ */
    .bounce   { animation: bounce 2s ease-in-out infinite; }
    .wiggle   { transform-origin: 0 0; animation: wiggle 2s ease-in-out infinite; }
    .cloud    { animation: cloud 12s linear infinite; }
    .delay    { animation-delay: -6s; }
    .dash     { animation: dash 0.37s linear infinite; } /* 0.37s ≈ 轮周长/转速，地面完全同步不打滑 */

    @keyframes spin   { to { transform: rotate(360deg); } }
    @keyframes bounce { 0%,25%,50%,75%,100% { transform: translateY(0); } 12.5%,62.5% { transform: translateY(-3px); } }
    @keyframes wiggle { 0%,100% { transform: rotate(-4deg); } 50% { transform: rotate(6deg); } }
    @keyframes cloud  { from { transform: translateX(850px); } to { transform: translateX(-250px); } }
    @keyframes dash   { to { stroke-dashoffset: -70; } }
  </style>
</head>
<body>

<svg viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- 轮子抽成组件，局部坐标原点在轴心 -->
    <g id="wheel">
      <circle r="60" fill="none" stroke="#2c3e50" stroke-width="7"/>
      <circle r="52" fill="none" stroke="#7f8c8d" stroke-width="1.5"/>
      <g stroke="#bdc3c7" stroke-width="2">
        <line y1="-52" y2="52"/><line x1="-52" x2="52"/>
        <line x1="-37" y1="-37" x2="37" y2="37"/><line x1="-37" y1="37" x2="37" y2="-37"/>
      </g>
      <circle r="6" fill="#34495e"/>
    </g>
  </defs>

  <!-- 🌤 背景 -->
  <rect width="100%" height="100%" fill="#81d4fa"/>
  <circle cx="700" cy="80" r="35" fill="#fff59d" opacity="0.9"/>
  <g class="cloud"><g transform="translate(0, 100)" opacity=".85" fill="#fff">
    <ellipse rx="35" ry="18"/><ellipse cx="25" cy="-12" rx="28" ry="20"/><ellipse cx="-25" cy="-8" rx="22" ry="15"/>
  </g></g>
  <g class="cloud delay"><g transform="translate(0, 190) scale(.7)" opacity=".7" fill="#fff">
    <ellipse rx="35" ry="18"/><ellipse cx="25" cy="-12" rx="28" ry="20"/><ellipse cx="-25" cy="-8" rx="22" ry="15"/>
  </g></g>

  <!-- 🛣 地面 (轮底刚好压在 y=420) -->
  <rect y="420" width="800" height="80" fill="#a1887f"/>
  <line x1="0" y1="420" x2="800" y2="420" stroke="#795548" stroke-width="5"/>
  <line x1="0" y1="420" x2="800" y2="420" stroke="#ffe082" stroke-width="4" stroke-dasharray="40 30" class="dash"/>

  <!-- 🚲🐦 整体（上下颠簸） -->
  <g class="bounce">

    <!-- 1️⃣ 轮子 -->
    <g transform="translate(280, 360)"><g class="spin"><use href="#wheel"/></g></g>
    <g transform="translate(520, 360)"><g class="spin"><use href="#wheel"/></g></g>

    <!-- 2️⃣ 远侧腿 (暗色 + SMIL 路径插值模拟屈伸) -->
    <path fill="none" stroke="#d67c00" stroke-width="8" stroke-linecap="round" d="M 365 245 Q 370 300 380 360">
      <animate attributeName="d" dur="2s" repeatCount="indefinite"
        values="M 365 245 Q 370 300 380 360;
                M 365 245 Q 380 290 400 340;
                M 365 245 Q 390 300 420 360;
                M 365 245 Q 380 310 400 380;
                M 365 245 Q 370 300 380 360"/>
    </path>

    <!-- 3️⃣ 红色车架 + 牙盘 -->
    <g stroke="#e74c3c" stroke-width="7" fill="none" stroke-linejoin="round" stroke-linecap="round">
      <line x1="280" y1="360" x2="400" y2="360"/>
      <line x1="280" y1="360" x2="370" y2="260"/>
      <line x1="370" y1="260" x2="400" y2="360"/>
      <line x1="370" y1="260" x2="490" y2="250"/>
      <line x1="400" y1="360" x2="490" y2="250"/>
      <line x1="490" y1="250" x2="520" y2="360"/>
    </g>
    <circle cx="400" cy="360" r="16" fill="none" stroke="#34495e" stroke-width="4"/>

    <!-- 4️⃣ 近侧腿 (亮色) -->
    <path fill="none" stroke="#f9a825" stroke-width="10" stroke-linecap="round" d="M 375 245 Q 390 300 420 360">
      <animate attributeName="d" dur="2s" repeatCount="indefinite"
        values="M 375 245 Q 390 300 420 360;
                M 375 245 Q 390 310 400 380;
                M 375 245 Q 370 300 380 360;
                M 375 245 Q 380 290 400 340;
                M 375 245 Q 390 300 420 360"/>
    </path>

    <!-- 5️⃣ 曲柄 / 踏板 / 小蹼足 -->
    <g transform="translate(400, 360)">
      <g class="spin">
        <line x1="-20" y1="0" x2="20" y2="0" stroke="#34495e" stroke-width="5" stroke-linecap="round"/>
        <!-- 左脚踏 -->
        <g transform="translate(-20, 0)"><g class="spin-rev">
          <rect x="-12" y="-3" width="24" height="7" rx="2" fill="#555"/>
          <path d="M -9 -3 L 9 -3 L 15 -11 L -15 -11 Z" fill="#d67c00" stroke="#a85f00" stroke-width="1.2"/>
        </g></g>
        <!-- 右脚踏 -->
        <g transform="translate(20, 0)"><g class="spin-rev">
          <rect x="-12" y="-3" width="24" height="7" rx="2" fill="#222"/>
          <path d="M -9 -3 L 9 -3 L 15 -11 L -15 -11 Z" fill="#f9a825" stroke="#e65100" stroke-width="1.2"/>
        </g></g>
      </g>
      <circle r="5" fill="#222"/>
    </g>

    <!-- 6️⃣ 鹈鹕本鹕 -->
    <!-- 尾巴 -->
    <path d="M 315 205 Q 285 190 280 200 Q 290 220 310 225 Z" fill="#ecf0f1" stroke="#bdc3c7" stroke-width="2"/>
    <!-- 身体 (刚好坐在 y=252 的车座上) -->
    <ellipse cx="360" cy="215" rx="55" ry="42" fill="#fff" stroke="#dcdde1" stroke-width="2" transform="rotate(-10 360 215)"/>
    <!-- 翅膀 & 黑色飞羽 -->
    <path d="M 335 195 Q 365 173 395 200 Q 380 230 345 220 Z" fill="#f8f9fa" stroke="#dcdde1" stroke-width="2"/>
    <path d="M 380 210 Q 395 200 398 195 Q 392 215 375 220 Z" fill="#34495e"/>
    <path d="M 365 217 Q 385 210 390 203 Q 382 223 360 225 Z" fill="#34495e"/>
    <!-- S 型长脖 (双 layer stroke 出描边) -->
    <path d="M 385 200 Q 405 155 448 117" fill="none" stroke="#dcdde1" stroke-width="34" stroke-linecap="round"/>
    <path d="M 385 200 Q 405 155 448 117" fill="none" stroke="#ffffff" stroke-width="30" stroke-linecap="round"/>
    <!-- 头 -->
    <circle cx="450" cy="110" r="23" fill="#fff" stroke="#dcdde1" stroke-width="2"/>
    <!-- 随风晃的呆毛 -->
    <g transform="translate(440, 90)"><g class="wiggle">
      <path d="M 0 0 Q -5 -12 5 -10" fill="none" stroke="#dcdde1" stroke-width="3" stroke-linecap="round"/>
    </g></g>
    <!-- 眼睛 -->
    <circle cx="459" cy="103" r="3.5" fill="#2c3e50"/>
    <circle cx="460" cy="102" r="1.2" fill="#fff"/>
    <!-- 上喙 -->
    <path d="M 466 104 Q 505 100 538 112 L 466 113 Z" fill="#f39c12" stroke="#d35400" stroke-width="1.5" stroke-linejoin="round"/>
    <!-- ✨ 灵魂大喉囊 (挂在嘴角一颠一颠) ✨ -->
    <g transform="translate(466, 112)"><g class="wiggle">
      <path d="M 0 0 Q 12 52 44 42 Q 66 32 72 0 Z" fill="#fdebd0" stroke="#d35400" stroke-width="1.5" stroke-linejoin="round"/>
      <path d="M 10 12 Q 35 22 62 10" fill="none" stroke="#f5cba7" stroke-width="1.5"/>
    </g></g>

    <!-- 7️⃣ 车座 & 车把 (盖在最上层) -->
    <path d="M 350 250 L 388 248 L 392 254 L 355 256 Z" fill="#2c3e50"/>
    <line x1="370" y1="252" x2="370" y2="262" stroke="#333" stroke-width="4"/>
    <path d="M 490 250 L 490 235 L 510 235" stroke="#2c3e50" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="506" y="231" width="12" height="8" rx="3" fill="#111"/>

  </g>
</svg>

</body>
</html>
