<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8fd6f0"/>
      <stop offset="100%" stop-color="#e9f8ff"/>
    </linearGradient>
    <linearGradient id="bodyGrad" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="55%" stop-color="#f7f2e7"/>
      <stop offset="100%" stop-color="#ddd2bd"/>
    </linearGradient>
    <linearGradient id="beakGrad" x1="0" y1="0" x2="1" y2="0.3">
      <stop offset="0%" stop-color="#ffc93c"/>
      <stop offset="100%" stop-color="#ff9500"/>
    </linearGradient>
  </defs>

  <!-- ================= 背景 ================= -->
  <rect width="800" height="600" fill="url(#skyGrad)"/>

  <!-- 太阳 -->
  <circle cx="92" cy="86" r="62" fill="#ffe066" opacity="0.25"/>
  <circle cx="92" cy="86" r="44" fill="#ffe066" opacity="0.9"/>

  <!-- 云朵 -->
  <g fill="#ffffff" opacity="0.92">
    <animateTransform attributeName="transform" type="translate" from="0 0" to="-1400 0" dur="40s" repeatCount="indefinite"/>
    <g>
      <ellipse cx="900" cy="120" rx="58" ry="30"/>
      <ellipse cx="952" cy="100" rx="42" ry="26"/>
      <ellipse cx="850" cy="104" rx="40" ry="24"/>
    </g>
    <g>
      <ellipse cx="1450" cy="176" rx="52" ry="27"/>
      <ellipse cx="1502" cy="156" rx="38" ry="22"/>
      <ellipse cx="1405" cy="160" rx="36" ry="21"/>
    </g>
  </g>

  <!-- 地面 -->
  <rect x="0" y="535" width="800" height="65" fill="#8ed35b"/>
  <rect x="0" y="535" width="800" height="7" fill="#6bb43c"/>

  <!-- 滚动的草丛和碎石 -->
  <g>
    <animateTransform attributeName="transform" type="translate" from="0 0" to="-150 0" dur="2s" repeatCount="indefinite"/>
    <g fill="#6bb43c">
      <path d="M-150 535 l7 -22 l7 22 z"/>
      <path d="M0 535 l7 -22 l7 22 z"/>
      <path d="M150 535 l7 -22 l7 22 z"/>
      <path d="M300 535 l7 -22 l7 22 z"/>
      <path d="M450 535 l7 -22 l7 22 z"/>
      <path d="M600 535 l7 -22 l7 22 z"/>
      <path d="M750 535 l7 -22 l7 22 z"/>
      <path d="M900 535 l7 -22 l7 22 z"/>
    </g>
    <g fill="#a9c98c">
      <circle cx="60" cy="570" r="4"/>
      <circle cx="240" cy="576" r="3"/>
      <circle cx="380" cy="566" r="4"/>
      <circle cx="520" cy="578" r="3"/>
      <circle cx="700" cy="568" r="4"/>
    </g>
  </g>

  <!-- 速度线 -->
  <g stroke="#ffffff" stroke-width="5" stroke-linecap="round" opacity="0.8">
    <line x1="30" y1="300" x2="130" y2="300">
      <animate attributeName="opacity" values="0;0.9;0" dur="0.9s" repeatCount="indefinite"/>
    </line>
    <line x1="60" y1="360" x2="120" y2="360">
      <animate attributeName="opacity" values="0.9;0;0.9" dur="0.7s" repeatCount="indefinite"/>
    </line>
    <line x1="10" y1="420" x2="110" y2="420">
      <animate attributeName="opacity" values="0;0.9;0" dur="1.1s" repeatCount="indefinite"/>
    </line>
  </g>

  <!-- ================= 自行车 ================= -->

  <!-- 后轮 -->
  <g>
    <circle cx="270" cy="450" r="85" fill="none" stroke="#2d3436" stroke-width="12"/>
    <circle cx="270" cy="450" r="76" fill="none" stroke="#b2bec3" stroke-width="4"/>
    <g stroke="#cfd8dc" stroke-width="3">
      <animateTransform attributeName="transform" type="rotate" from="0 270 450" to="360 270 450" dur="1s" repeatCount="indefinite"/>
      <line x1="270" y1="450" x2="270" y2="378"/>
      <line x1="270" y1="450" x2="321" y2="399"/>
      <line x1="270" y1="450" x2="342" y2="450"/>
      <line x1="270" y1="450" x2="321" y2="501"/>
      <line x1="270" y1="450" x2="270" y2="522"/>
      <line x1="270" y1="450" x2="219" y2="501"/>
      <line x1="270" y1="450" x2="198" y2="450"/>
      <line x1="270" y1="450" x2="219" y2="399"/>
    </g>
    <circle cx="270" cy="450" r="9" fill="#636e72"/>
  </g>

  <!-- 前轮 -->
  <g>
    <circle cx="530" cy="450" r="85" fill="none" stroke="#2d3436" stroke-width="12"/>
    <circle cx="530" cy="450" r="76" fill="none" stroke="#b2bec3" stroke-width="4"/>
    <g stroke="#cfd8dc" stroke-width="3">
      <animateTransform attributeName="transform" type="rotate" from="0 530 450" to="360 530 450" dur="1s" repeatCount="indefinite"/>
      <line x1="530" y1="450" x2="530" y2="378"/>
      <line x1="530" y1="450" x2="581" y2="399"/>
      <line x1="530" y1="450" x2="602" y2="450"/>
      <line x1="530" y1="450" x2="581" y2="501"/>
      <line x1="530" y1="450" x2="530" y2="522"/>
      <line x1="530" y1="450" x2="479" y2="501"/>
      <line x1="530" y1="450" x2="458" y2="450"/>
      <line x1="530" y1="450" x2="479" y2="399"/>
    </g>
    <circle cx="530" cy="450" r="9" fill="#636e72"/>
  </g>

  <!-- 车架 -->
  <g stroke="#2a9d8f" stroke-width="13" stroke-linecap="round" fill="none">
    <line x1="385" y1="445" x2="325" y2="305"/>
    <line x1="325" y1="305" x2="492" y2="312"/>
    <line x1="385" y1="445" x2="515" y2="378"/>
    <line x1="325" y1="305" x2="270" y2="450"/>
    <line x1="385" y1="445" x2="270" y2="450"/>
    <line x1="492" y1="312" x2="515" y2="378"/>
    <line x1="515" y1="378" x2="530" y2="450"/>
  </g>

  <!-- 车座 -->
  <ellipse cx="322" cy="300" rx="38" ry="12" fill="#2d3436" transform="rotate(-6 322 300)"/>

  <!-- 车把 -->
  <g stroke="#4a4a4a" stroke-width="10" stroke-linecap="round" fill="none">
    <line x1="492" y1="312" x2="497" y2="270"/>
    <path d="M497 270 Q535 262 558 274"/>
  </g>

  <!-- 远侧腿 -->
  <line x1="332" y1="288" stroke="#d98c4a" stroke-width="13" stroke-linecap="round">
    <animate attributeName="x2" dur="1.5s" repeatCount="indefinite"
             values="337;351;385;419;433;419;385;351;337"/>
    <animate attributeName="y2" dur="1.5s" repeatCount="indefinite"
             values="445;411;397;411;445;479;493;479;445"/>
  </line>

  <!-- 曲柄与脚踏 -->
  <g>
    <animateTransform attributeName="transform" type="rotate" from="0 385 445" to="360 385 445" dur="1.5s" repeatCount="indefinite"/>
    <line x1="385" y1="445" x2="433" y2="445" stroke="#636e72" stroke-width="9" stroke-linecap="round"/>
    <line x1="385" y1="445" x2="337" y2="445" stroke="#636e72" stroke-width="9" stroke-linecap="round"/>
    <circle cx="385" cy="445" r="12" fill="#4a4a4a"/>

    <!-- 脚踏 A -->
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0 433 445" to="-360 433 445" dur="1.5s" repeatCount="indefinite"/>
      <rect x="417" y="438" width="32" height="14" rx="4" fill="#3d3d3d"/>
    </g>
    <!-- 脚踏 B -->
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0 337 445" to="-360 337 445" dur="1.5s" repeatCount="indefinite"/>
      <rect x="321" y="438" width="32" height="14" rx="4" fill="#3d3d3d"/>
    </g>
  </g>

  <!-- ================= 鹈鹕 ================= -->
  <g>
    <animateTransform attributeName="transform" type="translate"
                      values="0 0; 0 -5; 0 0; 0 5; 0 0" dur="1.5s" repeatCount="indefinite"/>

    <!-- 脖子 -->
    <path d="M382 202 C412 180, 432 145, 448 112"
          stroke="#f5f0e6" stroke-width="46" stroke-linecap="round" fill="none"/>

    <!-- 头 -->
    <ellipse cx="456" cy="98" rx="40" ry="36" fill="#fdfaf3"/>

    <!-- 喙 -->
    <path d="M478 92 Q560 96 636 126 Q556 128 480 116 Z" fill="url(#beakGrad)"/>
    <path d="M480 116 Q520 190 600 168 Q625 158 634 127 Q556 129 480 116 Z"
          fill="#ffb703" opacity="0.95"/>
    <ellipse cx="516" cy="106" rx="5" ry="3" fill="#d97f00" opacity="0.7"/>

    <!-- 眼睛 -->
    <circle cx="472" cy="86" r="9" fill="#2d3436"/>
    <circle cx="475" cy="83" r="3" fill="#ffffff"/>

    <!-- 头顶小羽毛 -->
    <path d="M436 66 q-10 -18 4 -24 q-2 12 10 18 z" fill="#e6dccb"/>

    <!-- 身体 -->
    <ellipse cx="340" cy="240" rx="80" ry="60" fill="url(#bodyGrad)" transform="rotate(-8 340 240)"/>

    <!-- 尾巴 -->
    <path d="M272 218 L196 246 L212 274 L280 268 Z" fill="#e3d9c6"/>

    <!-- 翅膀（搭在车把上） -->
    <path d="M358 222 C402 226 452 246 500 272 C478 292 444 294 414 284 C384 274 360 252 358 222 Z"
          fill="#e6dccb" stroke="#d0c4ae" stroke-width="2"/>
    <path d="M392 250 C420 258 448 268 472 280" stroke="#d0c4ae" stroke-width="2" fill="none"/>
    <path d="M382 262 C408 270 434 278 456 288" stroke="#d0c4ae" stroke-width="2" fill="none"/>
  </g>

  <!-- 近侧腿 -->
  <line x1="355" y1="285" stroke="#f4a261" stroke-width="13" stroke-linecap="round">
    <animate attributeName="x2" dur="1.5s" repeatCount="indefinite"
             values="433;419;385;351;337;351;385;419;433"/>
    <animate attributeName="y2" dur="1.5s" repeatCount="indefinite"
             values="445;479;493;479;445;411;397;411;445"/>
  </line>

</svg>