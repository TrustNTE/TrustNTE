<svg width="600" height="400" viewBox="0 0 600 400" xmlns="http://www.w3.org/2000/svg">
  <!-- 定义渐变和样式 -->
  <defs>
    <linearGradient id="skyGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#87CEEB;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#E0F7FA;stop-opacity:1" />
    </linearGradient>
    <style>
      .wheel { animation: spin 1s linear infinite; transform-box: fill-box; transform-origin: center; }
      .leg { animation: pedal 1s linear infinite; transform-box: fill-box; transform-origin: top; }
      .pelican-body { animation: bounce 0.5s ease-in-out infinite alternate; }
      .scenery { animation: moveBackground 2s linear infinite; }
      
      @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
      @keyframes pedal { 0% { transform: rotate(20deg); } 50% { transform: rotate(-20deg); } 100% { transform: rotate(20deg); } }
      @keyframes bounce { from { transform: translateY(0); } to { transform: translateY(-3px); } }
      @keyframes moveBackground { from { transform: translateX(0); } to { transform: translateX(-100px); } }
    </style>
  </defs>

  <!-- 背景 -->
  <rect width="100%" height="100%" fill="url(#skyGradient)" />
  
  <!-- 移动的地面/云朵 -->
  <g class="scenery">
    <circle cx="100" cy="80" r="30" fill="#FFF" opacity="0.8"/>
    <circle cx="140" cy="90" r="40" fill="#FFF" opacity="0.8"/>
    <circle cx="400" cy="60" r="25" fill="#FFF" opacity="0.6"/>
    <path d="M-50 350 L 650 350" stroke="#8D6E63" stroke-width="20" />
    <path d="M-50 350 L 650 350" stroke="#4CAF50" stroke-width="10" stroke-dasharray="20, 40"/>
  </g>

  <!-- 自行车 -->
  <g transform="translate(150, 150)">
    <!-- 后轮 -->
    <g transform="translate(0, 150)">
      <circle r="40" fill="none" stroke="#333" stroke-width="8" class="wheel" />
      <circle r="35" fill="none" stroke="#DDD" stroke-width="2" stroke-dasharray="5,5" class="wheel"/>
    </g>
    <!-- 前轮 -->
    <g transform="translate(160, 150)">
      <circle r="40" fill="none" stroke="#333" stroke-width="8" class="wheel" />
      <circle r="35" fill="none" stroke="#DDD" stroke-width="2" stroke-dasharray="5,5" class="wheel"/>
    </g>
    
    <!-- 车架 -->
    <path d="M0 150 L60 60 L140 60 L160 150" fill="none" stroke="#FF5722" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M60 60 L80 150" fill="none" stroke="#FF5722" stroke-width="6" stroke-linecap="round"/>
    <line x1="140" y1="60" x2="130" y2="30" stroke="#333" stroke-width="6" stroke-linecap="round"/> <!-- 车把 -->
    <line x1="130" y1="30" x2="150" y2="30" stroke="#333" stroke-width="6" stroke-linecap="round"/> <!-- 把手 -->

    <!-- 鹈鹕 -->
    <g class="pelican-body">
      <!-- 腿 (简单的摆动动画) -->
      <path d="M70 110 L80 150" stroke="#FF9800" stroke-width="8" stroke-linecap="round" class="leg" />
      
      <!-- 身体 -->
      <ellipse cx="70" cy="90" rx="35" ry="25" fill="#FFF" stroke="#333" stroke-width="2"/>
      <!-- 翅膀 -->
      <path d="M60 80 Q90 80 100 100 Q80 110 60 90" fill="#EEE" stroke="#333" stroke-width="2"/>
      
      <!-- 脖子 -->
      <path d="M90 75 Q100 50 100 30" fill="none" stroke="#FFF" stroke-width="18" stroke-linecap="round"/>
      <path d="M90 75 Q100 50 100 30" fill="none" stroke="#333" stroke-width="22" stroke-linecap="round" stroke-dasharray="2, 100"/> <!-- 描边 -->

      <!-- 头 -->
      <circle cx="100" cy="30" r="18" fill="#FFF" stroke="#333" stroke-width="2"/>
      <!-- 眼睛 -->
      <circle cx="105" cy="25" r="3" fill="#000"/>
      <!-- 标志性的大嘴 (喙) -->
      <path d="M115 35 Q160 35 160 45 Q160 80 110 50" fill="#FFC107" stroke="#E65100" stroke-width="2"/>
      <path d="M110 30 L160 35" stroke="#E65100" stroke-width="2"/>
      
      <!-- 抓住把手的手/翅膀尖 -->
      <path d="M100 80 L130 30" fill="none" stroke="#FFF" stroke-width="10" stroke-linecap="round"/>
    </g>
  </g>
</svg>