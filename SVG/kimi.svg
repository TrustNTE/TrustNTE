<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="600" height="360">
  <style>
    .spin      { animation: spin 1.2s linear infinite; transform-box: fill-box; transform-origin: center; }
    .crank     { animation: spin 1.2s linear infinite; transform-box: fill-box; transform-origin: center; }
    .bob       { animation: bob 1.2s ease-in-out infinite; }
    .legA      { animation: legSwing 1.2s ease-in-out infinite; transform-box: view-box; transform-origin: 252px 205px; }
    .legB      { animation: legSwingB 1.2s ease-in-out infinite; transform-box: view-box; transform-origin: 252px 205px; }
    .wing      { animation: flap 1.2s ease-in-out infinite; transform-box: view-box; transform-origin: 246px 132px; }
    .eye       { animation: blink 4.6s ease-in-out infinite; transform-box: view-box; transform-origin: 318px 93px; }
    .road      { animation: roadScroll 1.1s linear infinite; }
    .cloud1    { animation: drift 26s linear infinite; }
    .cloud2    { animation: drift 38s linear infinite; animation-delay: -14s; }
    .speed     { animation: speedline 0.9s linear infinite; }
    .speed.s2  { animation-delay: -0.3s; }
    .speed.s3  { animation-delay: -0.6s; }

    @keyframes spin      { to { transform: rotate(360deg); } }
    @keyframes bob       { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-3.5px); } }
    @keyframes legSwing  { 0%,100% { transform: rotate(-12deg); } 50% { transform: rotate(16deg); } }
    @keyframes legSwingB { 0%,100% { transform: rotate(14deg); }  50% { transform: rotate(-14deg); } }
    @keyframes flap      { 0%,100% { transform: rotate(0deg); }   50% { transform: rotate(-11deg); } }
    @keyframes blink     { 0%,91%,100% { transform: scaleY(1); } 94.5% { transform: scaleY(0.12); } }
    @keyframes roadScroll{ to { transform: translateX(-240px); } }
    @keyframes drift     { from { transform: translateX(-140px); } to { transform: translateX(660px); } }
    @keyframes speedline { 0% { transform: translateX(0); opacity: 0; } 15% { opacity: .9; } 100% { transform: translateX(-70px); opacity: 0; } }
  </style>

  <!-- 云 -->
  <g class="cloud1" stroke="#9aa0a6" fill="none" stroke-width="2" opacity="0.7">
    <path d="M40 70 a14 14 0 0 1 14 -14 a18 18 0 0 1 34 -4 a13 13 0 0 1 20 10 a12 12 0 0 1 -4 8 z"/>
  </g>
  <g class="cloud2" stroke="#9aa0a6" fill="none" stroke-width="2" opacity="0.45">
    <path d="M60 120 a11 11 0 0 1 11 -11 a14 14 0 0 1 27 -3 a10 10 0 0 1 16 8 a10 10 0 0 1 -3 6 z"/>
  </g>

  <!-- 速度线 -->
  <g stroke="#c4c9cf" stroke-width="3" stroke-linecap="round">
    <line class="speed"    x1="95"  y1="215" x2="122" y2="215"/>
    <line class="speed s2" x1="78"  y1="235" x2="112" y2="235"/>
    <line class="speed s3" x1="90"  y1="255" x2="108" y2="255"/>
  </g>

  <!-- 路面 -->
  <line x1="0" y1="306" x2="600" y2="306" stroke="#c4c9cf" stroke-width="2"/>
  <g class="road" stroke="#c4c9cf" stroke-width="3" stroke-linecap="round">
    <line x1="20"  y1="306" x2="56"  y2="306"/>
    <line x1="140" y1="306" x2="176" y2="306"/>
    <line x1="260" y1="306" x2="296" y2="306"/>
    <line x1="380" y1="306" x2="416" y2="306"/>
    <line x1="500" y1="306" x2="536" y2="306"/>
    <line x1="620" y1="306" x2="656" y2="306"/>
    <line x1="740" y1="306" x2="776" y2="306"/>
    <line x1="860" y1="306" x2="896" y2="306"/>
  </g>

  <!-- 后轮 -->
  <g>
    <circle cx="170" cy="250" r="55" fill="none" stroke="#1a1a1a" stroke-width="5"/>
    <g class="spin" stroke="#9aa0a6" stroke-width="2.5">
      <line x1="170" y1="203" x2="170" y2="297"/>
      <line x1="123" y1="250" x2="217" y2="250"/>
      <line x1="137" y1="217" x2="203" y2="283"/>
      <line x1="203" y1="217" x2="137" y2="283"/>
      <circle cx="170" cy="250" r="6" fill="#1a1a1a" stroke="none"/>
    </g>
  </g>

  <!-- 前轮 -->
  <g>
    <circle cx="430" cy="250" r="55" fill="none" stroke="#1a1a1a" stroke-width="5"/>
    <g class="spin" stroke="#9aa0a6" stroke-width="2.5">
      <line x1="430" y1="203" x2="430" y2="297"/>
      <line x1="383" y1="250" x2="477" y2="250"/>
      <line x1="397" y1="217" x2="463" y2="283"/>
      <line x1="463" y1="217" x2="397" y2="283"/>
      <circle cx="430" cy="250" r="6" fill="#1a1a1a" stroke="none"/>
    </g>
  </g>

  <!-- 车架 -->
  <g stroke="#1a1a1a" stroke-width="5" stroke-linecap="round" fill="none">
    <path d="M170 250 L246 176"/>
    <path d="M170 250 L280 240"/>
    <path d="M246 176 L280 240"/>
    <path d="M246 176 L390 170"/>
    <path d="M390 170 L404 216"/>
    <path d="M404 216 L430 250"/>
    <path d="M398 168 L412 158"/>
    <path d="M412 158 L424 154"/>
  </g>
  <!-- 车座 -->
  <line x1="228" y1="172" x2="258" y2="172" stroke="#1a1a1a" stroke-width="7" stroke-linecap="round"/>

  <!-- 双腿交替踩 -->
  <g fill="none" stroke="#1a1a1a" stroke-width="6" stroke-linecap="round">
    <path class="legB" d="M252 205 Q 262 232 280 258"/>
    <path class="legA" d="M252 205 Q 262 228 282 250"/>
  </g>

  <!-- 牙盘 + 脚 -->
  <g class="crank">
    <circle cx="280" cy="240" r="17" fill="none" stroke="#1a1a1a" stroke-width="4"/>
    <line x1="280" y1="240" x2="280" y2="210" stroke="#1a1a1a" stroke-width="5" stroke-linecap="round"/>
    <line x1="280" y1="240" x2="280" y2="270" stroke="#1a1a1a" stroke-width="5" stroke-linecap="round"/>
    <rect x="269" y="206" width="22" height="8" rx="3" fill="#1a1a1a"/>
    <rect x="269" y="266" width="22" height="8" rx="3" fill="#1a1a1a"/>
    <ellipse cx="280" cy="202" rx="9" ry="6" fill="#f5a623"/>
    <ellipse cx="280" cy="278" rx="9" ry="6" fill="#f5a623"/>
  </g>

  <!-- 鹈鹕本体（带上下颠簸） -->
  <g class="bob">
    <!-- 尾巴羽毛 -->
    <g stroke="#1a1a1a" stroke-width="3.5" stroke-linecap="round" fill="none">
      <path d="M206 158 L182 150"/>
      <path d="M204 168 L178 168"/>
      <path d="M208 178 L186 188"/>
    </g>
    <!-- 身体 -->
    <ellipse cx="252" cy="150" rx="58" ry="42" fill="none" stroke="#1a1a1a" stroke-width="4.5"
             transform="rotate(-12 252 150)"/>
    <!-- 翅膀（扇动） -->
    <g class="wing">
      <path d="M212 138 Q 252 112 292 138 Q 262 152 236 156 Q 218 152 212 138 Z"
            fill="#1a1a1a" opacity="0.12"
            stroke="#1a1a1a" stroke-width="3"/>
      <path d="M236 146 L264 138" stroke="#1a1a1a" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    </g>
    <!-- 脖子 -->
    <path d="M296 128 Q 306 112 314 102" fill="none" stroke="#1a1a1a" stroke-width="16" stroke-linecap="round"/>
    <!-- 头 -->
    <circle cx="318" cy="96" r="17" fill="none" stroke="#1a1a1a" stroke-width="4.5"/>
    <!-- 呆毛 -->
    <g stroke="#1a1a1a" stroke-width="3" stroke-linecap="round" fill="none">
      <path d="M312 80 Q 308 70 300 66"/>
      <path d="M320 78 Q 320 66 314 60"/>
    </g>
    <!-- 眼睛（会眨眼） -->
    <g class="eye">
      <circle cx="318" cy="93" r="3.4" fill="#1a1a1a"/>
    </g>
    <!-- 大嘴 + 喉囊 -->
    <path d="M332 92 L398 102 L336 102 Z" fill="#f5a623" stroke="#1a1a1a" stroke-width="3" stroke-linejoin="round"/>
    <path d="M336 102 Q 368 132 394 106 Q 392 120 366 124 Q 340 120 336 102 Z"
          fill="#f5a623" opacity="0.65" stroke="#1a1a1a" stroke-width="3" stroke-linejoin="round"/>
  </g>
</svg>