# TrustNTE CNB 流水线：把 GitHub 最新 Release 同步到 CNB Releases
#
# 触发方式：
# 1. 每天 04:17 定时自动同步（crontab）
# 2. CNB 仓库页面上的「运行流水线」按钮（web_trigger_one）
# 3. API 调用（api_trigger_one）

main:
  # ① 定时：每天 04:17（Asia/Shanghai）自动同步
  "crontab: 17 4 * * *":
    - name: 定时同步最新 Release
      docker:
        image: python:3.11
      imports:
        - https://cnb.cool/TrustNTE/secret/-/blob/main/env.yml
      stages:
        - name: 同步
          script: |
            cd .github/workflows
            pip install -r requirements.txt
            python sync_release_to_cnb.py --cnb-token $CNB_TOKEN --github-token $GITHUB_TOKEN
            echo done!

  # ② 手动：仓库分支页的「运行流水线」按钮
  web_trigger_one:
    - docker:
        image: python:3.11
      imports:
        - https://cnb.cool/TrustNTE/secret/-/blob/main/env.yml
      stages:
        - name: 同步最新 Release 到 CNB
          script: |
            cd .github/workflows
            pip install -r requirements.txt
            python sync_release_to_cnb.py --cnb-token $CNB_TOKEN --github-token $GITHUB_TOKEN
            echo done!

  # ③ API 触发（OpenAPI）
  api_trigger_one:
    - docker:
        image: python:3.11
      imports:
        - https://cnb.cool/TrustNTE/secret/-/blob/main/env.yml
      stages:
        - name: API 触发同步
          script: |
            cd .github/workflows
            pip install -r requirements.txt
            python sync_release_to_cnb.py --cnb-token $CNB_TOKEN --github-token $GITHUB_TOKEN
            echo done!
